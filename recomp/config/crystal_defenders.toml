# The game drives the XMA hardware decoder by storing context bit masks to
# registers at computed addresses. These hooks call the runtime (audio.cpp) right
# before each store, with the register address in r10 and the mask in r11.
[[midasm_hook]]
name = "XmaClearHook"
address = 0x82201E7C
registers = ["r10", "r11"]

[[midasm_hook]]
name = "XmaLockHook"
address = 0x82202128
registers = ["r10", "r11"]

[[midasm_hook]]
name = "XmaKickHook"
address = 0x82202290
registers = ["r10", "r11"]
